services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: souqsmart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-souqsmart}
      POSTGRES_DB: souqsmart
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U souqsmart"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://souqsmart:${POSTGRES_PASSWORD:-souqsmart}@postgres:5432/souqsmart
      REDIS_URL: redis://redis:6379/0
    volumes:
      - vectorstore:/app/rag/vector_store
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8501:8501"
    restart: unless-stopped

volumes:
  pgdata:
  vectorstore:
